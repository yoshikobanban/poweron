<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日本史 2学期中間対策</title>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=BIZ+UDPMincho:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --main: #9A3412; --main-light: #FDF0E8;
  --green: #16A34A; --green-light: #F0FDF4; --red: #DC2626; --red-light: #FEF2F2;
  --gray-50: #F9FAFB; --gray-100: #F3F4F6; --gray-200: #E5E7EB; --gray-400: #9CA3AF; --gray-600: #4B5563; --gray-800: #1F2937; --gray-900: #111827;
  --radius: 12px; --radius-sm: 8px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'BIZ UDPGothic', 'Hiragino Sans', sans-serif; background: #F5F6F8; color: var(--gray-900); min-height: 100vh; }
button { font-family: inherit; }
header { background: var(--main); color: white; padding: 14px 16px 12px; position: sticky; top: 0; z-index: 50; box-shadow: 0 2px 6px rgba(0,0,0,.15); }
header .ttl { font-size: 18px; font-weight: 700; }
header .sub { font-size: 12px; opacity: .9; margin-top: 2px; }
.tabs { display: flex; gap: 4px; margin-top: 10px; }
.tab { flex: 1; min-width: 0; padding: 9px 2px; border: none; border-radius: 8px; background: rgba(255,255,255,.18); color: white; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; }
.tab.active { background: white; color: var(--main); }
.container { max-width: 680px; margin: 0 auto; padding: 12px 12px 60px; }
.card { background: white; border-radius: var(--radius); box-shadow: 0 1px 4px rgba(0,0,0,.08); }
.secs { padding: 10px 12px; margin-bottom: 12px; display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 6px 11px; border: 2px solid var(--gray-200); border-radius: 20px; background: white; font-size: 13px; font-weight: 700; color: var(--gray-600); cursor: pointer; }
.chip.active { background: var(--main); border-color: var(--main); color: white; }
.chip small { font-weight: 400; opacity: .8; }
.start { padding: 22px 18px; text-align: center; }
.start .big { font-size: 40px; }
.start h2 { font-size: 18px; margin-top: 4px; }
.start p { font-size: 14px; color: var(--gray-600); line-height: 1.7; margin: 8px 0 12px; }
.small { font-size: 12px; color: var(--gray-400); }
.progress { padding: 10px 14px; margin-bottom: 12px; }
.pinfo { display: flex; justify-content: space-between; font-size: 13px; color: var(--gray-600); margin-bottom: 6px; }
.pbar { height: 8px; background: var(--gray-200); border-radius: 4px; overflow: hidden; }
.pfill { height: 8px; background: var(--main); transition: width .3s; }
.qcard { padding: 18px; margin-bottom: 12px; }
.qtag { display: inline-block; background: var(--main-light); color: var(--main); font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 20px; margin-bottom: 10px; }
.qtext { font-size: 17px; line-height: 1.8; }
.qtext .blank { display: inline-block; min-width: 72px; border-bottom: 3px solid var(--main); margin: 0 2px; }
.qtext.kana { font-size: 24px; font-weight: 700; text-align: center; color: var(--main); padding: 8px 0; }
.choices { display: flex; flex-direction: column; gap: 9px; margin-top: 14px; }
.choice { display: flex; gap: 10px; align-items: center; text-align: left; padding: 12px 14px; border: 2px solid var(--gray-200); border-radius: var(--radius-sm); background: white; font-size: 16px; color: var(--gray-800); cursor: pointer; line-height: 1.5; }
.choice.kanji { font-family: 'BIZ UDPMincho', serif; font-size: 24px; justify-content: flex-start; }
.choice:hover:not(:disabled) { border-color: var(--main); background: var(--main-light); }
.choice .lb { flex-shrink: 0; width: 26px; height: 26px; border-radius: 50%; background: var(--gray-100); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: var(--gray-600); font-family: 'BIZ UDPGothic', sans-serif; }
.choice.correct { border-color: var(--green); background: var(--green-light); }
.choice.correct .lb { background: var(--green); color: white; }
.choice.wrong { border-color: var(--red); background: var(--red-light); }
.choice.wrong .lb { background: var(--red); color: white; }
.choice:disabled { cursor: default; }
.expl { display: none; margin-top: 12px; padding: 12px 14px; border-left: 4px solid var(--main); background: var(--gray-50); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }
.expl.show { display: block; }
.expl .res { font-size: 15px; font-weight: 700; color: var(--green); margin-bottom: 6px; }
.expl .res.ng { color: var(--red); }
.expl .txt { font-size: 14px; color: var(--gray-600); line-height: 1.8; }
.next { width: 100%; padding: 14px; border: none; border-radius: var(--radius-sm); background: var(--main); color: white; font-size: 16px; font-weight: 700; cursor: pointer; display: none; }
.next.show { display: block; }
.big-btn { width: 100%; padding: 14px; border: none; border-radius: var(--radius-sm); background: var(--main); color: white; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 8px; }
.big-btn.red { background: var(--red); }
.big-btn:disabled { background: var(--gray-200); color: var(--gray-400); cursor: default; }
.result { padding: 24px 18px; text-align: center; margin-bottom: 12px; }
.result .score { font-size: 52px; font-weight: 700; color: var(--main); line-height: 1.1; }
.result .score small { font-size: 22px; color: var(--gray-400); font-weight: 400; }
.result .msg { font-size: 16px; font-weight: 700; margin-top: 8px; }
.miss { padding: 16px; margin-bottom: 12px; }
.miss h3 { font-size: 14px; color: var(--red); margin-bottom: 8px; }
.miss .item { padding: 8px 0; border-bottom: 1px solid var(--gray-100); font-size: 14px; line-height: 1.6; }
.miss .item:last-child { border-bottom: none; }
.miss .ans { color: var(--green); font-weight: 700; }
.flash { padding: 24px 18px; min-height: 230px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; cursor: pointer; border: 2px solid var(--main-light); margin-bottom: 12px; }
.flash.back { background: var(--main-light); border-color: var(--main); }
.flash .meta { font-size: 12px; color: var(--gray-400); margin-bottom: 12px; }
.flash .q { font-size: 17px; line-height: 1.8; }
.flash .a { font-size: 26px; font-weight: 700; color: var(--main); }
.flash .a.kanji { font-family: 'BIZ UDPMincho', serif; font-size: 32px; }
.flash .h { font-size: 13px; color: var(--gray-600); margin-top: 12px; line-height: 1.7; text-align: left; background: white; padding: 10px 12px; border-radius: var(--radius-sm); }
.flash .tip { font-size: 12px; color: var(--gray-400); margin-top: 14px; }
.nav { display: flex; gap: 8px; }
.nav button { flex: 1; padding: 13px; border-radius: var(--radius-sm); border: 2px solid var(--gray-200); background: white; font-size: 15px; font-weight: 700; color: var(--gray-600); cursor: pointer; }
.nav button.primary { background: var(--main); border-color: var(--main); color: white; }
</style>
</head>
<body>
<header>
  <div class="ttl" id="hTitle"></div>
  <div class="sub" id="hSub"></div>
  <div class="tabs">
    <button class="tab active" data-v="quiz" onclick="go('quiz')">✏️ 4択クイズ</button>
    <button class="tab" data-v="card" onclick="go('card')">🃏 暗記カード</button>
    <button class="tab" data-v="wrong" onclick="go('wrong')">🎯 苦手だけ</button>
  </div>
</header>
<div class="container">
  <div class="card secs" id="secs"></div>
  <div id="main"></div>
</div>
<script>
const D = {"key": "nihonshi_2gakki_chukan", "title": "🏯 日本史 2学期中間対策", "sub": "飛鳥の朝廷〜律令国家の成立（プリントNO.7・NO.8）", "secs": [{"id": "a", "name": "飛鳥の朝廷", "desc": "プリントNO.7 前半：磐井の乱・蘇我氏と物部氏・聖徳太子の政治・遣隋使"}, {"id": "b", "name": "飛鳥文化", "desc": "プリントNO.7 後半：寺院・仏像・工芸・伽藍配置"}, {"id": "c", "name": "大化の改新", "desc": "プリントNO.8 前半：乙巳の変・改新政府・改新の詔"}, {"id": "d", "name": "天智〜持統", "desc": "プリントNO.8 後半：白村江の戦い・壬申の乱・天武天皇・藤原京"}, {"id": "e", "name": "史料", "desc": "憲法十七条・『隋書』倭国伝・改新の詔、プリントの共通テスト型問題"}, {"id": "k", "name": "漢字テスト", "desc": "告知プリントの15語。まちがえやすい字形の中から正しい漢字を選ぼう。", "kanji": true, "extra": true}], "qs": [{"sec": "a", "q": "527年、筑紫国造の磐井が新羅と結んで起こした反乱を ___ という。", "c": ["磐井の乱", "壬申の乱", "乙巳の変", "白村江の戦い"], "h": "527年 磐井の乱。近江毛野ら6万の百済応援軍を妨害した。"}, {"sec": "a", "q": "磐井の乱で、磐井が結んだ朝鮮半島の国は ___ 。", "c": ["新羅", "百済", "高句麗", "隋"], "h": "百済・新羅が加耶諸国を圧迫していた時期。磐井は新羅と結んだ。"}, {"sec": "a", "q": "磐井の墓といわれる、福岡県八女市の古墳は ___ 。", "c": ["岩戸山古墳", "大仙陵古墳", "稲荷山古墳", "高松塚古墳"], "h": "岩戸山古墳には石人・石馬が置かれていた。"}, {"sec": "a", "q": "磐井の乱を鎮圧した物部氏の人物は ___ 。", "c": ["物部麁鹿火", "物部尾輿", "物部守屋", "大伴金村"], "h": "物部麁鹿火（あらかい）が鎮圧した。"}, {"sec": "a", "q": "継体天皇を擁立して勢力を広げたが、任那四県を百済に割譲して失脚したのは ___ 。", "c": ["大伴金村", "物部尾輿", "蘇我稲目", "物部麁鹿火"], "h": "512年に任那四県を百済に割譲 → 物部尾輿らに批判されて失脚。"}, {"sec": "a", "q": "仏教の受け入れをめぐって、崇仏派の蘇我稲目と対立した排仏派は ___ 。", "c": ["物部尾輿", "物部守屋", "大伴金村", "蘇我馬子"], "h": "欽明朝の崇仏論争：物部尾輿〔排仏派〕と蘇我稲目〔崇仏派〕。"}, {"sec": "a", "q": "大臣として勢力を広げ、三蔵（財政）を管理し、のちに崇峻天皇を暗殺したのは ___ 。", "c": ["蘇我馬子", "蘇我稲目", "蘇我入鹿", "蘇我蝦夷"], "h": "蘇我氏：稲目 → 馬子 → 蝦夷 → 入鹿 の順。"}, {"sec": "a", "q": "587年に蘇我馬子に敗れて滅んだ大連は ___ 。", "c": ["物部守屋", "物部尾輿", "大伴金村", "物部麁鹿火"], "h": "蘇我馬子と物部守屋の抗争 → 守屋敗死（587年）→ 蘇我氏が政権を握る。"}, {"sec": "a", "q": "589年に南北朝を統一した中国の王朝は ___ 。", "c": ["隋", "唐", "魏", "宋"], "h": "隋（581〜618）。高句麗遠征に失敗し、618年に滅亡。"}, {"sec": "a", "q": "592年、蘇我馬子と対立して暗殺された天皇は ___ 。", "c": ["崇峻天皇", "推古天皇", "欽明天皇", "孝徳天皇"], "h": "崇峻天皇の暗殺（592年）→ 推古天皇を擁立。"}, {"sec": "a", "q": "592年に即位した、日本初の女帝は ___ 。", "c": ["推古天皇", "皇極天皇", "持統天皇", "斉明天皇"], "h": "推古天皇。おいの聖徳太子が摂政として協力した。"}, {"sec": "a", "q": "推古天皇の摂政として政治を行ったのは ___ 。", "c": ["聖徳太子（厩戸王）", "蘇我馬子", "中大兄皇子", "小野妹子"], "h": "摂政＝天皇が幼い・女性・病気のときに代わって政治を行う役職。"}, {"sec": "a", "q": "603年に定められた、才能や功績に応じて個人に位を与える制度は ___ 。", "c": ["冠位十二階", "憲法十七条", "八色の姓", "公地公民"], "h": "徳・仁・礼・信・義・智をそれぞれ大小に分け、冠の色で区別した。一代限り。"}, {"sec": "a", "q": "冠位十二階で、いちばん上の位は ___ 。", "c": ["大徳", "大仁", "大礼", "大智"], "h": "徳 → 仁 → 礼 → 信 → 義 → 智 の順で、それぞれ大・小。小野妹子は大礼。"}, {"sec": "a", "q": "604年に制定された、仏教・儒教の影響を受け、天皇中心の国家の理想を示したものは ___ 。", "c": ["憲法十七条", "冠位十二階", "改新の詔", "近江令"], "h": "日本初の成文法とされる。「和を以て貴しと為し」。"}, {"sec": "a", "q": "聖徳太子らが編纂した、天皇の系譜や事績をまとめた歴史書は ___ 。", "c": ["天皇記", "国記", "古事記", "日本書紀"], "h": "『天皇記』『国記』は現存しない。のちの『古事記』（712年）『日本書紀』（720年）につながる。"}, {"sec": "a", "q": "聖徳太子らが編纂した、国家成立の歴史と地誌をまとめた歴史書は ___ 。", "c": ["国記", "天皇記", "風土記", "日本書紀"], "h": "『天皇記』＝天皇の系譜や事績、『国記』＝国家成立の歴史と地誌。"}, {"sec": "a", "q": "607年に隋に派遣された使節を ___ という。", "c": ["遣隋使", "遣唐使", "朝貢使", "防人"], "h": "600年が1回目、607年が2回目の遣隋使。"}, {"sec": "a", "q": "607年に遣隋使として隋に渡り、対等外交を主張したのは ___ 。", "c": ["小野妹子", "裴世清", "高向玄理", "中臣鎌足"], "h": "小野妹子は608年に裴世清とともに帰国し、再び隋へ渡った。"}, {"sec": "a", "q": "遣隋使のようすが記された中国の歴史書は ___ 。", "c": ["『隋書』倭国伝", "『魏志』倭人伝", "『宋書』倭国伝", "『漢書』地理志"], "h": "著者は魏徴。「日出づる処の天子…」の国書が記されている。"}, {"sec": "a", "q": "倭の国書を見て怒った隋の皇帝は ___ 。", "c": ["煬帝", "文帝", "太宗", "光武帝"], "h": "煬帝（ようだい）。「蛮夷の書、無礼なるもの有り」。"}, {"sec": "a", "q": "608年、答礼使として隋から日本に派遣されたのは ___ 。", "c": ["裴世清", "小野妹子", "曇徴", "観勒"], "h": "裴世清（はいせいせい）。"}, {"sec": "a", "q": "608年の遣隋使に同行した留学生・学問僧の組み合わせは ___ 。", "c": ["高向玄理・南淵請安・旻", "小野妹子・裴世清・旻", "曇徴・観勒・恵慈", "中臣鎌足・南淵請安・旻"], "h": "3人とも長く中国で学び、帰国後に大化の改新に影響を与えた。"}, {"sec": "b", "q": "6世紀後半〜7世紀中頃の、日本最初の仏教文化を ___ という。", "c": ["飛鳥文化", "白鳳文化", "天平文化", "国風文化"], "h": "推古朝の仏教興隆策がもと。"}, {"sec": "b", "q": "飛鳥文化に大きな影響を与えた中国の時代は ___ 。", "c": ["南北朝", "唐", "漢", "宋"], "h": "ほかにギリシア・ペルシアの影響も → エンタシス・忍冬唐草文様。"}, {"sec": "b", "q": "法隆寺の柱の中ほどのふくらみなどに見られる、ギリシアの影響を受けた技法は ___ 。", "c": ["エンタシス", "アルカイックスマイル", "忍冬唐草文様", "伽藍配置"], "h": "エンタシス＝柱の中ほどをふくらませる技法。"}, {"sec": "b", "q": "蘇我馬子が建立した日本最初の仏教寺院（正式名称は法興寺）は ___ 。", "c": ["飛鳥寺", "法隆寺", "四天王寺", "広隆寺"], "h": "596年建立。"}, {"sec": "b", "q": "聖徳太子が建立した（607年）、現存する世界最古の木造建築は ___ 。", "c": ["法隆寺", "飛鳥寺", "四天王寺", "中宮寺"], "h": "別名 斑鳩寺。"}, {"sec": "b", "q": "670年に法隆寺が焼失したと記す『日本書紀』の記述を裏づける、法隆寺の再建説の根拠となった遺跡は ___ 。", "c": ["若草伽藍跡", "飛鳥池遺跡", "岩戸山古墳", "藤原宮跡"], "h": "若草伽藍跡の発掘で、法隆寺は再建されたものと考えられるようになった。"}, {"sec": "b", "q": "聖徳太子が593年に建立した、大阪の寺は ___ 。", "c": ["四天王寺", "法隆寺", "広隆寺", "飛鳥寺"], "h": "四天王寺式の伽藍配置で有名。"}, {"sec": "b", "q": "秦河勝が建立し、聖徳太子から賜った仏像を安置した京都の寺は ___ 。", "c": ["広隆寺", "四天王寺", "中宮寺", "飛鳥寺"], "h": "622年建立。京都太秦。秦氏は渡来人。"}, {"sec": "b", "q": "端正で厳しい表情、杏仁形の目・仰月形の唇が特徴の彫刻様式は ___ 。", "c": ["北魏様式", "百済（中国南朝）様式", "唐様式", "天平様式"], "h": "北魏様式は金銅像が中心。"}, {"sec": "b", "q": "柔和で丸みのある表情が特徴の彫刻様式は ___ 。", "c": ["百済（中国南朝）様式", "北魏様式", "唐様式", "天平様式"], "h": "百済（中国南朝）様式は木像が中心。「北は金銅、南は木」。"}, {"sec": "b", "q": "法隆寺金堂にある、北魏様式の金銅像は ___ 。", "c": ["釈迦三尊像", "百済観音像", "半跏思惟像", "救世観音像"], "h": "法隆寺金堂釈迦三尊像。作者は鞍作鳥。"}, {"sec": "b", "q": "法隆寺金堂釈迦三尊像や飛鳥大仏をつくった仏師は ___ 。", "c": ["鞍作鳥（止利仏師）", "曇徴", "観勒", "秦河勝"], "h": "鞍作鳥（くらつくりのとり）。北魏様式。"}, {"sec": "b", "q": "1884年にフェノロサが発見した、聖徳太子の等身像とされる像は ___ 。", "c": ["法隆寺夢殿救世観音像", "法隆寺百済観音像", "中宮寺半跏思惟像", "飛鳥寺釈迦如来像"], "h": "木造。北魏様式。"}, {"sec": "b", "q": "中宮寺や広隆寺にある、弥勒菩薩を表した像は ___ 。", "c": ["半跏思惟像", "釈迦三尊像", "百済観音像", "救世観音像"], "h": "片足をもう一方のひざにのせて考えるポーズ。百済（南朝）様式の木像。"}, {"sec": "b", "q": "北魏様式の仏像に見られる、口元の独特なほほえみを ___ という。", "c": ["アルカイックスマイル（古拙の微笑）", "エンタシス", "忍冬唐草文様", "杏仁形"], "h": "アルカイックスマイル＝古拙の微笑。"}, {"sec": "b", "q": "610年に来日し、彩色・紙・墨の製法を伝えた高句麗の僧は ___ 。", "c": ["曇徴", "観勒", "恵慈", "旻"], "h": "曇徴（どんちょう）＝高句麗、絵の具・紙・墨。"}, {"sec": "b", "q": "602年に来日し、暦法・天文・地理などを伝えた百済の僧は ___ 。", "c": ["観勒", "曇徴", "恵慈", "旻"], "h": "観勒（かんろく）＝百済、暦。"}, {"sec": "b", "q": "聖徳太子の師となった高句麗の僧は ___ 。", "c": ["恵慈", "観勒", "曇徴", "鞍作鳥"], "h": "恵慈（えじ）。"}, {"sec": "b", "q": "須弥座や扉の絵、玉虫の羽の装飾で知られる法隆寺の工芸品は ___ 。", "c": ["玉虫厨子", "天寿国繡帳", "三経義疏", "百済観音像"], "h": "玉虫厨子（たまむしのずし）。"}, {"sec": "b", "q": "聖徳太子の妃・橘大郎女の作とされる、中宮寺の刺繡は ___ 。", "c": ["天寿国繡帳", "玉虫厨子", "三経義疏", "天皇記"], "h": "天寿国繡帳（てんじゅこくしゅうちょう）。"}, {"sec": "b", "q": "法華経・維摩経・勝鬘経の注釈書で、聖徳太子が編纂したとされるのは ___ 。", "c": ["三経義疏", "天皇記", "国記", "日本書紀"], "h": "三経義疏（さんぎょうぎしょ）。現存するのは法華経の注釈書。"}, {"sec": "b", "q": "塔を中心に、3つの金堂が囲む伽藍配置は ___ 。", "c": ["飛鳥寺式", "四天王寺式", "法隆寺式", "薬師寺式"], "h": "飛鳥寺式：塔を3つの金堂が囲む。"}, {"sec": "b", "q": "中門・塔・金堂・講堂が一直線に並ぶ伽藍配置は ___ 。", "c": ["四天王寺式", "飛鳥寺式", "法隆寺式", "東大寺式"], "h": "四天王寺式：一直線。"}, {"sec": "b", "q": "塔と金堂が左右に並ぶ伽藍配置は ___ 。", "c": ["法隆寺式", "四天王寺式", "飛鳥寺式", "薬師寺式"], "h": "法隆寺式：塔と金堂が横並び。"}, {"sec": "b", "q": "金堂の前に東西2つの塔を置く、白鳳文化の伽藍配置は ___ 。", "c": ["薬師寺式", "東大寺式", "法隆寺式", "飛鳥寺式"], "h": "薬師寺式＝白鳳文化、東大寺式＝天平文化（塔が回廊の外）。"}, {"sec": "c", "q": "618年に隋が滅んだあと、中国を統一した王朝は ___ 。", "c": ["唐", "宋", "魏", "新羅"], "h": "唐（618〜907）。"}, {"sec": "c", "q": "7世紀前半の朝鮮半島で主導権を争ったのは、高句麗・新羅と ___ 。", "c": ["百済", "隋", "加耶", "渤海"], "h": "高句麗・百済・新羅の三国。"}, {"sec": "c", "q": "蘇我氏の専横を行った父子の組み合わせは ___ 。", "c": ["蘇我蝦夷・入鹿", "蘇我稲目・馬子", "蘇我馬子・蝦夷", "物部尾輿・守屋"], "h": "蝦夷（えみし）が父、入鹿（いるか）が子。"}, {"sec": "c", "q": "643年、蘇我入鹿に攻められて自殺した聖徳太子の子は ___ 。", "c": ["山背大兄王", "大友皇子", "中大兄皇子", "大海人皇子"], "h": "山背大兄王（やましろのおおえのおう）。"}, {"sec": "c", "q": "645年、蘇我入鹿が暗殺され、蘇我蝦夷が自殺した事件を ___ という。", "c": ["乙巳の変", "壬申の乱", "磐井の乱", "白村江の戦い"], "h": "乙巳の変（いっしのへん）。"}, {"sec": "c", "q": "乙巳の変で蘇我入鹿を暗殺した中心人物の組み合わせは ___ 。", "c": ["中大兄皇子・中臣鎌足", "大海人皇子・中臣鎌足", "中大兄皇子・蘇我馬子", "聖徳太子・小野妹子"], "h": "蘇我倉山田石川麻呂も加わった。"}, {"sec": "c", "q": "蘇我入鹿が暗殺された宮は ___ 。", "c": ["飛鳥板蓋宮", "難波長柄豊碕宮", "近江大津宮", "飛鳥浄御原宮"], "h": "飛鳥板蓋宮（あすかいたぶきのみや）の大極殿。"}, {"sec": "c", "q": "乙巳の変のあと、皇極天皇に代わって即位した天皇（軽皇子）は ___ 。", "c": ["孝徳天皇", "天智天皇", "斉明天皇", "天武天皇"], "h": "孝徳天皇。皇太子は中大兄皇子。"}, {"sec": "c", "q": "改新政府で皇太子となったのは ___ 。", "c": ["中大兄皇子", "中臣鎌足", "大海人皇子", "山背大兄王"], "h": "中大兄皇子はのちの天智天皇。"}, {"sec": "c", "q": "改新政府で内臣となったのは ___ 。", "c": ["中臣鎌足", "阿倍内麻呂", "蘇我倉山田石川麻呂", "旻"], "h": "中臣鎌足はのちの藤原鎌足。"}, {"sec": "c", "q": "改新政府で左大臣となったのは ___ 。", "c": ["阿倍内麻呂", "蘇我倉山田石川麻呂", "中臣鎌足", "高向玄理"], "h": "左大臣＝阿倍内麻呂、右大臣＝蘇我倉山田石川麻呂。"}, {"sec": "c", "q": "改新政府で右大臣となったのは ___ 。", "c": ["蘇我倉山田石川麻呂", "阿倍内麻呂", "中臣鎌足", "蘇我入鹿"], "h": "蘇我 const $ = id => document.getElementById(id);

function shuffle(a) { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
const secOf = id => D.secs.find(s => s.id === id);

const ALL = D.qs.map((q, i) => Object.assign({ id: i }, q));
const byId = id => ALL.find(q => q.id === id);
function addBank(q) { const b = loadBank(); if (!b.includes(q.id)) { b.push(q.id); saveBank(b); } }
function rmBank(q) { saveBank(loadBank().filter(x => x !== q.id)); }
const bankList = () => loadBank().map(byId).filter(q => q && (sec === 'all' || q.sec === sec));

function drawSecs() {
  const n = id => ALL.filter(q => id === 'all' ? !secOf(q.sec).extra : q.sec === id).length;
  $('secs').innerHTML = [{ id: 'all', name: '全部' }].concat(D.secs).map(s =>

      <div class="expl" id="expl"><div class="res" id="res"></div><div class="txt">${esc(q.h || '')}</div></div>
    </div>
    <button class="next" id="nextBtn" onclick="nextQ()">${cur + 1 < qs.length ? '次の問題 →' : '結果を見る'}</button>
    <div style="text-align:center;margin-top:12px"><a class="small" style="cursor:pointer;text-decoration:underline" onclick="quizStart()">← やめる</a></div>`;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function answer(i) {
  if (answered) return; answered = true;
  const q = qs[cur], btns = document.querySelectorAll('.choice'), ci = order.indexOf(0), ok = i === ci;
  btns.forEach(b => b.disabled = true);
  btns[ci].classList.add('correct'); if (!ok) btns[i].classList.add('wrong');
  const r = $('res');
  r.textContent = ok ? '⭕ 正解！' : '❌ 正解は「' + q.c[0] + '」';
  if (!ok) r.classList.add('ng');
  if (ok) { score++; if (view === 'wrong') rmBank(q); } else { missed.push(q); addBank(q); }
  $('expl').classList.add('show'); $('nextBtn').classList.add('show');
}
function nextQ() { cur++; cur >= qs.length ? showResult() : drawQ(); }
function showResult() {
  const n = qs.length, pct = Math.round(score / n * 100);
  const msg = pct === 100 ? '🏆 全問正解！完璧！' : pct >= 80 ? '🌟 すごい！あと少し！' : pct >= 60 ? '⭐ よくできました！' : pct >= 40 ? '💪 苦手問題でもう1回！' : '📖 暗記カードで確認してから再挑戦！';
  const b = bankList().length;
  $('main').innerHTML = `
    <div class="card result"><div class="score">${score}<small> / ${n}</small></div><div class="small">${pct}%</div><div class="msg">${msg}</div></div>
    ${missed.length ? `<div class="card miss"><h3>❌ 間違えた問題（${missed.length}問）→ 苦手に保存しました</h3>
      ${missed.map(q => `<div class="item"><span class="small">${esc(secOf(q.sec).name)}</span><br>${esc(q.q.replace('___', '（　）'))}<br><span class="ans">正解：${esc(q.c[0])}</span></div>`).join('')}</div>` : ''}
    <button class="big-btn" onclick="quizBegin()">もう一度 🔄</button>
    <button class="big-btn red" ${b ? '' : 'disabled'} onclick="go('wrong');quizBegin()">苦手問題だけ復習（${b}問） 🎯</button>`;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ===== 暗記カード ===== */
let cards = [], ci = 0, flipped = false;
function startCard() { cards = shuffle(ALL.filter(inSec)); ci = 0; flipped = false; drawCard(); }
function drawCard() {
  if (!cards.length) { $('main').innerHTML = '<div class="card start"><p>カードがありません</p></div>'; return; }
  const q = cards[ci], kj = isKanji(q);
  const front = kj ? `<div class="a" style="color:var(--gray-900)">${esc(q.q)}</div><div class="tip">漢字を思い浮かべてからタップ</div>`
                   : `<div class="q">${qText(q)}</div><div class="tip">答えを言ってからタップ</div>`;
  const back = `<div class="a ${kj ? 'kanji' : ''}">${esc(q.c[0])}</div>${q.h ? `<div class="h">💡 ${esc(q.h)}</div>` : ''}`;
  $('main').innerHTML = `
    <div class="card flash ${flipped ? 'back' : ''}" onclick="flipped=!flipped;drawCard()">
      <div class="meta">${esc(secOf(q.sec).name)}　${ci + 1} / ${cards.length}</div>${flipped ? back : front}</div>
    <div class="nav"><button onclick="moveCard(-1)">← 前へ</button><button class="primary" onclick="moveCard(1)">次へ →</button></div>`;
}
function moveCard(d) { ci = (ci + d + cards.length) % cards.length; flipped = false; drawCard(); }

$('hTitle').textContent = D.title; $('hSub').textContent = D.sub;
drawSecs(); render();
</script>
</body>
